name: Arbitrage paper trading

# Builds the evidence that the detector finds *capturable* edge before any
# real order is ever sent: every run scans, waits, re-prices what it found at
# fresh quotes, and appends the result to a committed ledger under arbitrage/.
# The summary there carries the go-live gate that `arb-scan trade --live` checks.

on:
  schedule:
    - cron: "7,37 * * * *" # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write # commits the ledger under arbitrage/

concurrency:
  group: arbitrage-paper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workspace dependencies
        run: npm install

      - name: Scan, verify and update the ledger
        env:
          ARB_OUTPUT: ${{ github.workspace }}/arbitrage-paper.md
        run: |
          npm run scan --workspace @veil/arbitrage -- paper \
            --state-dir "${{ github.workspace }}/arbitrage" \
            --notional 1000 --min-net-bps 1 --depth 10 --verify-after 5 --carry-min-apr 15
        # The scan + ledger summary is appended to the job summary via GITHUB_STEP_SUMMARY.

      - name: Commit ledger
        run: |
          git config user.name "arbitrage-paper-bot"
          git config user.email "actions@github.com"
          git checkout -- package-lock.json || true
          git add arbitrage/
          if git diff --cached --quiet; then
            echo "Ledger unchanged; nothing to commit."
          else
            git commit -m "arbitrage: paper ledger $(date -u +%FT%H:%MZ) [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
