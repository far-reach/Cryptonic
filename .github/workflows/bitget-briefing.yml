name: Bitget daily briefing

on:
  schedule:
    - cron: "0 6 * * *" # every day at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workspace dependencies
        run: npm install

      - name: Generate briefing
        env:
          BRIEFING_OUTPUT: bitget-briefing.md
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run briefing --workspace @veil/bitget-briefing
        # The briefing is appended to the job summary automatically via GITHUB_STEP_SUMMARY.

      - name: Upload briefing artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitget-briefing-${{ github.run_id }}
          path: bitget-briefing.md
          retention-days: 30
