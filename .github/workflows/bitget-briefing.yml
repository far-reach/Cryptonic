name: Bitget daily briefing

on:
  schedule:
    - cron: "0 6 * * *" # every day at 06:00 UTC
  workflow_dispatch:
  push:
    # Live integration test: re-run the briefing whenever the bot itself changes.
    paths:
      - "packages/bitget-briefing/**"
      - ".github/workflows/bitget-briefing.yml"

permissions:
  contents: write # commits the briefing history under briefings/

concurrency:
  group: bitget-briefing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workspace dependencies
        run: npm install

      - name: Generate briefing
        env:
          BRIEFING_OUTPUT: bitget-briefing.md
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run briefing --workspace @veil/bitget-briefing
        # The briefing is appended to the job summary automatically via GITHUB_STEP_SUMMARY.

      - name: Upload briefing artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitget-briefing-${{ github.run_id }}
          path: bitget-briefing.md
          retention-days: 30

      - name: Commit briefing history
        run: |
          set -x
          mkdir -p briefings
          cp bitget-briefing.md "briefings/$(date -u +%F).md"
          cp bitget-briefing.md briefings/latest.md
          git config user.name "bitget-briefing-bot"
          git config user.email "actions@github.com"
          # npm install may have touched the lockfile on the runner; don't commit or carry that.
          git checkout -- . || true
          git status --short
          git add briefings/
          if git diff --cached --quiet; then
            echo "Briefing unchanged; nothing to commit."
          else
            git commit -m "briefings: $(date -u +%F) [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
