<!doctype html>
<meta charset="utf-8">
<title>VEIL — renderer</title>
<style>
  html,body{margin:0;background:#000;height:100%;overflow:hidden}
  canvas{display:block}
</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
/* VEIL — deterministic music-video renderer.
   Every element is a pure function of t (seconds), so frames can be rendered
   in any order. Timeline mirrors synth_veil.py exactly: 120 BPM, bar=2s. */

const W = 1920, H = 1080;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const BEAT = 0.5, BAR = 2.0, TOTAL = 180.0;

const PAL = {
  bg:'#04050d', bg2:'#0a0d1f', gold:'#ffd166', violet:'#b388ff',
  teal:'#7fd8e8', pearl:'#e8e0ff', cold:'#8fb8ff', amber:'#ffb45e',
  amber2:'#ff8d3a', white:'#f5f2ff', dim:'#525a7a', red:'#ff6b8a'
};
const PAUSES = [[42.4,42.95],[90.4,90.95],[146.4,146.95],[162.4,162.95]];
const GONES = [43.0, 91.0, 147.0, 163.0];

// ---------- deterministic helpers ----------
function hash1(n){ let x = Math.sin(n*127.1+311.7)*43758.5453; return x-Math.floor(x); }
function hash2(a,b){ return hash1(a*57.31+b*7.77); }
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const smooth=u=>{u=clamp(u,0,1);return u*u*(3-2*u);};
const ease=(t,t0,t1)=>smooth((t-t0)/(t1-t0));
function beatPulse(t, decay=6){ const ph=(t/BEAT)%1; return Math.exp(-ph*decay); }
function barPhase(t){ return (t/BAR)%1; }
function noise1(t,seed){ // smooth value noise
  const i=Math.floor(t), f=t-i;
  return lerp(hash2(i,seed), hash2(i+1,seed), smooth(f))*2-1;
}
function inPause(t){ return PAUSES.some(([a,b])=>t>=a&&t<b); }
function nearGone(t){ for(const g of GONES){ if(t>=g && t<g+0.8) return 1-(t-g)/0.8; } return 0; }

// ---------- drawing utils ----------
function bgFill(c0,c1){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,c0); g.addColorStop(1,c1);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function vignette(a=0.55){
  const g=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.85);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,`rgba(0,0,0,${a})`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function glowText(txt,x,y,size,color,{weight=800,blur=28,alpha=1,tracking=0,font='Montserrat'}={}){
  ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=color;
  ctx.shadowColor=color; ctx.shadowBlur=blur;
  ctx.font=`${weight} ${size}px ${font}, sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(tracking>0){
    let total=0; for(const ch of txt) total+=ctx.measureText(ch).width+tracking;
    let cx=x-total/2+tracking/2;
    for(const ch of txt){ const w=ctx.measureText(ch).width; ctx.fillText(ch,cx+w/2,y); cx+=w+tracking; }
  } else ctx.fillText(txt,x,y);
  ctx.restore();
}
function typeOn(txt,t,t0,cps=28){ // typewriter reveal
  const n=clamp(Math.floor((t-t0)*cps),0,txt.length);
  return txt.slice(0,n);
}
// small pedestrian silhouette with a floating number ticker
function pedestrian(x,y,s,ph,tickerOn,seed,t,alarm=0){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle='rgba(24,28,52,0.9)'; ctx.strokeStyle='rgba(70,80,130,0.8)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(0,-46,7,7,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-8,-36); ctx.quadraticCurveTo(0,-40,8,-36); ctx.lineTo(5,0);
  ctx.lineTo(2+Math.sin(ph)*6,26); ctx.lineTo(-2-Math.sin(ph)*6,26); ctx.lineTo(-5,0); ctx.closePath(); ctx.fill();
  if(tickerOn>0){
    const amt=(1000+hash1(seed)*99000)|0;
    const col=alarm>0?PAL.red:PAL.teal;
    ctx.globalAlpha=0.75*tickerOn; ctx.shadowColor=col; ctx.shadowBlur=10;
    ctx.fillStyle=col; ctx.font='600 15px "DejaVu Sans Mono", monospace'; ctx.textAlign='center';
    ctx.fillText('$'+(amt+((t*2+seed)|0)%89).toLocaleString(),0,-66+Math.sin(t*2+seed)*2);
  }
  ctx.restore();
}
// transparent glass towers, parallax
function cityLayer(t,depth,frost=0,dawn=0){
  const speed=6*depth, offs=(t*speed)%260;
  const n=Math.ceil(W/180)+3;
  for(let i=-1;i<n;i++){
    const seed=Math.floor((t*speed)/260)*0+i*13.7+depth*91;
    const bw=120+hash1(seed)*120, bh=(0.25+hash1(seed+1)*0.5)*H*depth*1.35;
    const x=i*260-offs, y=H*0.82-bh;
    const a=0.10+0.16*depth;
    ctx.strokeStyle=dawn>0?`rgba(255,${170+40*dawn|0},130,${a+0.08})`:`rgba(110,140,220,${a+0.1})`;
    ctx.fillStyle=dawn>0?`rgba(80,50,60,${a*0.8})`:`rgba(30,40,80,${a})`;
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.rect(x,y,bw,bh); ctx.fill(); ctx.stroke();
    // windows
    ctx.fillStyle=dawn>0?`rgba(255,190,120,${0.35*depth})`:`rgba(140,190,255,${0.30*depth})`;
    for(let wx=x+12;wx<x+bw-12;wx+=26) for(let wy=y+12;wy<y+bh-10;wy+=34){
      if(hash2(wx*0.11,wy*0.13+seed)>0.55) ctx.fillRect(wx,wy,10,16);
    }
    if(frost>0){ // frost rises from the bottom
      const fh=bh*clamp(frost,0,1);
      const g=ctx.createLinearGradient(0,y+bh-fh,0,y+bh);
      g.addColorStop(0,'rgba(232,224,255,0)'); g.addColorStop(1,`rgba(232,224,255,${0.35*depth})`);
      ctx.fillStyle=g; ctx.fillRect(x,y+bh-fh,bw,fh);
    }
  }
}
// golden light-moths: stateless particle cloud
function moths(t,cx,cy,count,spread,seedBase,rise=40,alpha=0.9,size=2.6){
  ctx.save();
  for(let i=0;i<count;i++){
    const s=seedBase+i;
    const born=hash1(s)*4;
    const age=(t*0.7+born)%4;
    const u=age/4;
    const ang=hash1(s+0.1)*Math.PI*2;
    const r=hash1(s+0.2)*spread;
    const x=cx+Math.cos(ang)*r+Math.sin(t*(1+hash1(s+0.3))+s)*14;
    const y=cy+Math.sin(ang)*r*0.6-age*rise+Math.cos(t*1.3+s*2)*8;
    const a=alpha*Math.sin(u*Math.PI);
    const col=hash1(s+0.4)>0.75?PAL.violet:PAL.gold;
    ctx.globalAlpha=a; ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(x,y,size*(0.6+hash1(s+0.5)),0,7); ctx.fill();
  }
  ctx.restore();
}
// ---------- the dancer (parametric stick-figure of light) ----------
function drawFigure(x,y,s,pose,{color=PAL.pearl,glow=22,alpha=1,veil=0,t=0}={}){
  // pose: {lean, headTilt, arms:[[sh,el],[sh,el]], legs:[[hip,kn],[hip,kn]]} angles rad
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.rotate(pose.lean||0);
  ctx.globalAlpha=alpha;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.shadowColor=color; ctx.shadowBlur=glow;
  // veil ribbons behind
  if(veil>0){
    for(let k=0;k<4;k++){
      const ph=t*2.2+k*1.7;
      ctx.strokeStyle=k%2?'rgba(179,136,255,0.5)':'rgba(255,209,102,0.45)';
      ctx.lineWidth=7-k; ctx.globalAlpha=alpha*veil*0.7;
      ctx.beginPath(); ctx.moveTo(-12,-78);
      ctx.bezierCurveTo(-30-18*Math.sin(ph),-40+8*Math.cos(ph*1.3),
                        -46-26*Math.sin(ph*0.8),18*k-10, -34-34*Math.sin(ph*0.6),60+k*14);
      ctx.stroke();
      ctx.beginPath(); ctx.moveTo(12,-78);
      ctx.bezierCurveTo(30+18*Math.cos(ph),-40+8*Math.sin(ph*1.2),
                        46+26*Math.cos(ph*0.7),18*k-10, 34+34*Math.cos(ph*0.5),60+k*14);
      ctx.stroke();
    }
    ctx.globalAlpha=alpha;
  }
  ctx.strokeStyle=color; ctx.lineWidth=9;
  const seg=(x0,y0,a,len)=>[x0+Math.sin(a)*len, y0+Math.cos(a)*len];
  // spine
  ctx.beginPath(); ctx.moveTo(0,-70); ctx.lineTo(0,-10); ctx.stroke();
  // head
  ctx.beginPath(); ctx.arc(Math.sin(pose.headTilt||0)*10,-92,16,0,7); ctx.stroke();
  // arms from shoulders (0,-64)
  for(let i=0;i<2;i++){
    const [a1,a2]=pose.arms[i], sx=i?10:-10;
    const [ex,ey]=seg(sx,-64,a1,34);
    const [hx,hy]=seg(ex,ey,a2,32);
    ctx.beginPath(); ctx.moveTo(sx,-64); ctx.lineTo(ex,ey); ctx.lineTo(hx,hy); ctx.stroke();
  }
  // legs from hips (0,-10)
  for(let i=0;i<2;i++){
    const [a1,a2]=pose.legs[i], sx=i?6:-6;
    const [kx,ky]=seg(sx,-10,a1,42);
    const [fx,fy]=seg(kx,ky,a2,42);
    ctx.beginPath(); ctx.moveTo(sx,-10); ctx.lineTo(kx,ky); ctx.lineTo(fx,fy); ctx.stroke();
  }
  ctx.restore();
}
function walkPose(ph){ // ph: walk cycle 0..1
  const sw=Math.sin(ph*Math.PI*2);
  return {lean:0.03, headTilt:0,
    arms:[[2.6+sw*0.5,2.9+sw*0.4],[2.6-sw*0.5,2.9-sw*0.4]],
    legs:[[0.35*sw,0.15+0.3*Math.max(0,-sw)],[-0.35*sw,0.15+0.3*Math.max(0,sw)]]};
}
function dancePose(t){ // beat-locked 4-move loop
  const b=Math.floor(t/BEAT)%4, ph=(t/BEAT)%1, u=smooth(ph);
  const P=[
    {lean:-0.1,headTilt:-.2,arms:[[1.2,0.5],[4.4,5.2]],legs:[[0.3,0.1],[-0.4,0.5]]},
    {lean:0.1,headTilt:.2,arms:[[4.6,5.6],[1.4,0.8]],legs:[[-0.3,0.4],[0.4,0.1]]},
    {lean:0,headTilt:0,arms:[[2.2,1.2],[3.9,4.9]],legs:[[0.5,0.2],[-0.5,0.6]]},
    {lean:0,headTilt:.1,arms:[[0.6,0.2],[5.6,6.0]],legs:[[-0.2,0.3],[0.2,0.2]]},
  ];
  const a=P[b], b2=P[(b+1)%4], mix={};
  const mixArr=(p,q)=>p.map((v,i)=>Array.isArray(v)?v.map((w,j)=>lerp(w,q[i][j],u)):lerp(v,q[i],u));
  return {lean:lerp(a.lean,b2.lean,u), headTilt:lerp(a.headTilt,b2.headTilt,u),
          arms:mixArr(a.arms,b2.arms), legs:mixArr(a.legs,b2.legs)};
}
// palm-sweep pose: u 0..1 hand travels over face
function sweepPose(u){
  const a1=lerp(0.6,2.0,u), a2=lerp(-2.6,-0.7,u);
  return {lean:0,headTilt:0,arms:[[2.7,2.9],[a1,a2]],legs:[[0.1,0.05],[-0.1,0.05]]};
}

// ---------- caption track ----------
const CAP=[];
function cap(t0,dur,text,style){ CAP.push({t0,t1:t0+dur,text,style}); }
// whisper
cap(0.8,3.2,"everybody's watching…",'wh'); cap(4.2,3.4,"so give 'em something they can't see",'wh');
// v1
cap(8.2,3.8,"Glass house, glass streets, glass everything",'v');
cap(12.2,3.8,"every move I make got a thousand eyes following",'v');

cap(24.2,3.8,"but I found a door in a wall of light",'p');
cap(28.2,3.6,"where the numbers close their eyes and the loud goes quiet",'p');
// chorus 1
cap(32.0,1.9,"VEIL ON",'C'); cap(34.0,1.9,"FADE OUT",'C');
cap(36.2,3.6,"still right here but you can't trace me now",'c2');
cap(40.2,2.2,"one hand over my face and I'm —",'c2');

cap(44.2,1.8,"see the shine, not the source",'c2'); cap(46.2,1.7,"VEIL ON",'C');

cap(56.2,3.8,"they archive my heartbeats, they auction my nights",'v');

cap(80.0,1.9,"VEIL ON",'C'); cap(82.0,1.9,"FADE OUT",'C');
cap(84.2,3.6,"still right here but you can't trace me now",'c2');

cap(104.5,3.8,"curtains on the windows, envelopes for letters",'b');

for(const s of [120,124,128,132]){ cap(s,0.9,"V-V-VEIL ON",'D'); cap(s+2,0.9,"VEIL ON — GONE",'D'); }
// final choruses
cap(136.0,1.9,"VEIL ON",'C'); cap(138.0,1.9,"FADE OUT",'C');

cap(148.2,1.8,"see the shine, not the source",'c2'); cap(150.2,1.6,"VEIL ON",'C');

function drawCaptions(t){
  for(const c of CAP){
    if(t<c.t0||t>c.t1) continue;
    const life=ease(t,c.t0,c.t0+0.15)*(1-ease(t,c.t1-0.25,c.t1));
    const s=c.style;
    if(s==='wh') glowText(typeOn(c.text,t,c.t0,24),W/2,H*0.86,44,PAL.pearl,{weight:300,blur:16,alpha:0.85*life,tracking:10});
    else if(s==='v') glowText(c.text,W/2,H*0.885,40,PAL.white,{weight:600,blur:12,alpha:0.9*life});
    else if(s==='p') glowText(c.text,W/2,H*0.885,42,PAL.teal,{weight:600,blur:16,alpha:0.92*life});
    else if(s==='b') glowText(c.text,W/2,H*0.52,54,PAL.amber,{weight:300,blur:18,alpha:0.9*life,tracking:6});
    else if(s==='c2') glowText(c.text,W/2,H*0.885,44,PAL.gold,{weight:600,blur:16,alpha:0.95*life});
    else if(s==='ch') glowText(c.text,W/2,H*0.885,48,PAL.violet,{weight:800,blur:20,alpha:0.95*life});
    else if(s==='C'){
      const k=1+0.18*beatPulse(t);
      const inMove=t>=32&&t<40; // keep the face composition clear during THE MOVE
      glowText(c.text,W/2,inMove?H*0.85:H*0.5,(inMove?100:190)*k,PAL.gold,{weight:800,blur:60,alpha:0.96*life});
    } else if(s==='G'){
      const k=1+0.5*Math.exp(-(t-c.t0)*5);
      glowText(c.text,W/2,H*0.5,270*k,PAL.white,{weight:800,blur:80,alpha:life});
    } else if(s==='D'){
      const j=(hash1(Math.floor(t*20))-0.5)*30;
      glowText(c.text,W/2+j,H*0.44+j*0.4,150,hash1(t*9)>0.5?PAL.gold:PAL.violet,{weight:800,blur:50,alpha:0.95*life});
    }
  }
}

// ---------- scenes ----------
function scEye(t,u,rev=false){ // rev: outro variant
  bgFill('#03040a','#0a0d22');
  const zoom=rev?1.06:1+0.10*u;
  ctx.save(); ctx.translate(W/2,H/2); ctx.scale(zoom,zoom); ctx.translate(-W/2,-H/2);
  // the eye
  const ex=W/2, ey=H/2-30, rx=560, ry=300;
  ctx.save();
  ctx.beginPath(); ctx.ellipse(ex,ey,rx,ry,0,0,7); ctx.clip();
  bgFill('#0d1026','#151a3a');
  // iris
  const ir=250;
  const g=ctx.createRadialGradient(ex,ey,30,ex,ey,ir);
  if(rev){ g.addColorStop(0,'#1a1230'); g.addColorStop(0.5,'#7b4fd0'); g.addColorStop(0.8,'#3ec9b8'); g.addColorStop(1,'#101426'); }
  else { g.addColorStop(0,'#241d10'); g.addColorStop(0.55,'#8a6a2a'); g.addColorStop(0.85,'#3a4f86'); g.addColorStop(1,'#101426'); }
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(ex,ey,ir,0,7); ctx.fill();
  // reflected skyline bars inside iris
  for(let i=0;i<26;i++){
    const a=i/26*Math.PI*2+0.2, bh=60+hash1(i)*120;
    const x=ex+Math.cos(a)*150, y=ey+Math.sin(a)*90;
    ctx.save(); ctx.translate(x,y); ctx.rotate(a+Math.PI/2);
    ctx.fillStyle=rev?'rgba(180,240,230,0.25)':'rgba(255,220,150,0.28)';
    ctx.fillRect(-6,0,12,bh*0.5); ctx.restore();
  }
  // lenses embedded in the iris city — turn toward viewer / go dark
  for(let i=0;i<48;i++){
    const a=hash1(i*3.3)*Math.PI*2, r=90+hash1(i*1.7)*140;
    const x=ex+Math.cos(a)*r, y=ey+Math.sin(a)*r*0.75;
    let on=1, turn=clamp((u*3-hash1(i)),0,1);
    if(rev){ on = hash1(i*7.7) > u*1.25 ? 1:0; turn=1; }
    if(on>0){
      ctx.fillStyle=`rgba(20,24,40,0.9)`; ctx.strokeStyle=PAL.red; ctx.lineWidth=1.5;
      ctx.globalAlpha=0.9;
      ctx.beginPath(); ctx.arc(x,y,7,0,7); ctx.fill();
      ctx.globalAlpha=0.5+0.5*turn;
      ctx.beginPath(); ctx.arc(x,y,3*turn+1,0,7);
      ctx.fillStyle=rev?PAL.teal:PAL.red; ctx.shadowColor=PAL.red; ctx.shadowBlur=8*turn; ctx.fill();
      ctx.shadowBlur=0;
    }
  }
  // pupil
  ctx.fillStyle='#05060c'; ctx.beginPath(); ctx.arc(ex,ey,86+6*Math.sin(t*0.8),0,7); ctx.fill();
  ctx.globalAlpha=0.8; ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.beginPath(); ctx.arc(ex-30,ey-34,14,0,7); ctx.fill();
  ctx.restore();
  // lids
  ctx.strokeStyle='rgba(190,200,255,0.5)'; ctx.lineWidth=5; ctx.shadowColor=PAL.violet; ctx.shadowBlur=18;
  ctx.beginPath(); ctx.ellipse(ex,ey,rx,ry,0,Math.PI*1.02,Math.PI*1.98); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(ex,ey,rx,ry,0,Math.PI*0.02,Math.PI*0.98); ctx.stroke();
  ctx.shadowBlur=0;
  ctx.restore();
  if(rev) moths(t,W/2,H/2,60,420,900,26,0.5);
  vignette(0.7);
}
function scCityWalk(t,u){
  bgFill('#070a18','#1a1430');
  // low sun
  const g=ctx.createRadialGradient(W*0.78,H*0.30,10,W*0.78,H*0.30,420);
  g.addColorStop(0,'rgba(255,190,120,0.5)'); g.addColorStop(1,'rgba(255,190,120,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  cityLayer(t,0.35); cityLayer(t,0.6); cityLayer(t,0.95);
  ctx.fillStyle='rgba(10,12,26,0.9)'; ctx.fillRect(0,H*0.82,W,H*0.18);
  // pedestrians with tickers
  for(let i=0;i<9;i++){
    const sp=20+hash1(i*9)*30, x=((i*260+t*sp)%(W+200))-100;
    pedestrian(x,H*0.83,1.15,t*6+i,1,i*3.1,t);
  }
  // heroine walks with data ribbon trail
  const hx=W*0.30+u*W*0.12, hy=H*0.835;
  for(let k=0;k<3;k++){

  drawFigure(W*0.6,H*0.86,1.6,
    {lean:0.02,headTilt:0.2,arms:[[2.9,3.1],[3.3,3.6]],legs:[[0.05,0.02],[-0.05,0.02]]},
    {color:'rgba(255,220,180,0.95)',glow:14,veil:0.15,t});
  vignette(0.72);
}
function scDrop(t,u){
  // strobing dance break
  const strobe=beatPulse(t,9);
  bgFill(strobe>0.5?'#1c1440':'#07060f','#0b0818');
  if(strobe>0.6){ ctx.fillStyle=`rgba(179,136,255,${(strobe-0.6)*0.5})`; ctx.fillRect(0,0,W,H); }
  // shake
  const sh=6*strobe;
  ctx.save(); ctx.translate(noise1(t*30,21)*sh,noise1(t*31,22)*sh);
  cityLayer(t*0.4,0.5); cityLayer(t*0.4,0.85);
  // moth rain
  for(let i=0;i<180;i++){
    const x=hash1(i*7.7)*W, y=((hash1(i*3.3)*H)+t*260*(0.5+hash1(i)))%H;
    ctx.globalAlpha=0.5+0.4*Math.sin(t*6+i); ctx.fillStyle=hash1(i)>0.5?PAL.gold:PAL.violet;
    ctx.fillRect(x,y,2.5,9);
  }
  ctx.globalAlpha=1;
  // hero dance, larger than life
  drawFigure(W/2,H*0.82,2.3,dancePose(t),{color:PAL.pearl,glow:30,veil:1,t});
  moths(t,W/2,H*0.5,120,320,777,60,0.8,2.6);
  ctx.restore();
  vignette(0.5);
}
function scTransform(t,u){
  bgFill('#0b0d24','#1c1030');
  const fr=smooth(u); // frost progress
  // aurora ribbons
  for(let k=0;k<4;k++){
    ctx.beginPath();
    for(let i=0;i<=40;i++){
      const x=i/40*W;
      const y=H*(0.16+k*0.07)+Math.sin(i*0.3+t*0.8+k*2)*60*(0.5+fr);
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    const cols=['rgba(179,136,255,0.30)','rgba(127,216,232,0.25)','rgba(255,209,102,0.20)','rgba(232,224,255,0.22)'];
    ctx.strokeStyle=cols[k]; ctx.lineWidth=26-k*4; ctx.shadowColor=PAL.violet; ctx.shadowBlur=30;
    ctx.stroke();
  }
  ctx.shadowBlur=0;
  cityLayer(t*0.05,0.45,fr,0.3); cityLayer(t*0.05,0.8,fr,0.3);
  ctx.fillStyle='rgba(12,10,24,0.92)'; ctx.fillRect(0,H*0.82,W,H*0.18);
  // crowd — tickers fading out as frost rises
  for(let i=0;i<10;i++){
    const x=((i*230+t*18)%(W+200))-100;
    pedestrian(x,H*0.83,1.1,t*5+i,1-fr,i*3.7,t);
  }
  drawFigure(W*0.42,H*0.835,1.5,dancePose(t),{color:PAL.pearl,veil:1,t});
  moths(t,W*0.42,H*0.6,90,420,88,44,0.7,2.4);
  vignette(0.55);
}
function scHeroWalk(t,u){
  bgFill('#1a1030','#2b1638'); // dawn
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(255,160,110,0.25)'); g.addColorStop(0.5,'rgba(123,79,208,0.15)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  cityLayer(t*0.04,0.4,1,1); cityLayer(t*0.04,0.75,1,1);
  ctx.fillStyle='rgba(16,10,26,0.92)'; ctx.fillRect(0,H*0.82,W,H*0.18);
  // crowd with no tickers — just people
  for(let i=0;i<8;i++){
    const x=((i*260+t*20)%(W+200))-100;
    pedestrian(x,H*0.83,1.12,t*6+i,0,i*4.1,t);
  }
  // hero walks toward camera: scale grows
  const s=lerp(1.1,2.6,smooth(u));
  drawFigure(W/2,H*0.84+u*40,s,walkPose((t*1.5)%1),{color:PAL.pearl,glow:26,veil:0.8,t});
  moths(t,W/2,H*0.55,50,500,246,30,0.4,2);
  vignette(0.5);
}
function scTitle(t,u){
  bgFill('#03030a','#0a0a18');
  // title holds 176-178.4, then the palm-sweep wipe takes the frame to black
  const fin=ease(t,176.0,177.0);
  const wipe=smooth(clamp((t-178.4)/1.4,0,1));
  moths(t,W/2,H*0.4,80,500,999,30,0.5*(1-wipe),2.4);
  glowText('V E I L',W/2,H*0.42,220,PAL.pearl,{weight:300,blur:60,alpha:fin*(1-wipe*0.9),tracking:40});
  glowText('a song about keeping one thing yours',W/2,H*0.58,34,PAL.violet,{weight:300,blur:14,alpha:0.8*fin*(1-wipe),tracking:8});
  glowText('veil on.',W/2,H*0.68,40,PAL.gold,{weight:600,blur:18,alpha:(0.4+0.5*Math.sin(t*2))*fin*(1-wipe)});
  if(wipe>0){
    const y=wipe*H*1.2;
    ctx.fillStyle='rgba(2,2,6,1)'; ctx.fillRect(0,0,W,y);
    ctx.strokeStyle=PAL.gold; ctx.shadowColor=PAL.gold; ctx.shadowBlur=40; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); ctx.shadowBlur=0;
  }
  vignette(0.6);
}

// ---------- timeline ----------
const SCENES=[
  [0,8,   (t,u)=>scEye(t,u,false)],
  [8,16,  scCityWalk],
  [16,24, scKiosk],
  [24,32, scAlley],
  [32,40, (t,u)=>scMove(t,u,32)],
  [40,48, scShimmerCrowd],
  [48,56, (t,u)=>scCrowdWave(t,u,48)],
  [56,64, scAuction],
  [64,72, scOneThing],
  [72,80, scSkyQuestion],
  [80,88, scRooftop],
  [88,96, scMurmuration],
  [96,104,scDoorOpen],
  [104,112,scAmberRoom],
  [112,120,scAmberRoom],
  [120,128,scDrop],
  [128,136,scDrop],
  [136,144,scTransform],
  [144,152,scTransform],
  [152,160,(t,u)=>scCrowdWave(t,u,152)],
  [160,168,scHeroWalk],
  [168,176,(t,u)=>scEye(t,u,true)],
  [176,180,scTitle],
];

function render(t){
  t=clamp(t,0,TOTAL-0.001);
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  for(const [t0,t1,fn] of SCENES){
    if(t>=t0&&t<t1){ fn(t,(t-t0)/(t1-t0)); break; }
  }
  // THE PAUSE: hard blackout with a heartbeat of text
  if(inPause(t)){
    ctx.fillStyle='rgba(2,2,5,0.94)'; ctx.fillRect(0,0,W,H);
  }
  // GONE flash
  const gf=nearGone(t);
  if(gf>0){ ctx.fillStyle=`rgba(245,242,255,${gf*0.28})`; ctx.fillRect(0,0,W,H); }
  drawCaptions(t);
  // film grain (cheap, deterministic)
  ctx.globalAlpha=0.05;
  for(let i=0;i<160;i++){
    const s=Math.floor(t*24)*161+i;
    ctx.fillStyle=hash1(s)>0.5?'#fff':'#000';
    ctx.fillRect(hash1(s+0.3)*W,hash1(s+0.7)*H,2,2);
  }
  ctx.globalAlpha=1;
  // letterbox hint
  ctx.fillStyle='rgba(0,0,0,0.9)';
  ctx.fillRect(0,0,W,26); ctx.fillRect(0,H-26,W,26);
  ctx.restore();
}

// ---------- API ----------
const FPS = 24;
window.renderFrame = async (i)=>{ render(i/FPS); return true; };
window.ready = document.fonts.load('800 100px Montserrat')
  .then(()=>document.fonts.load('300 100px Montserrat'))
  .then(()=>document.fonts.load('600 100px Montserrat'))
  .then(()=>true);
// preview: ?t=SECONDS renders one frame; no param = play
const q=new URLSearchParams(location.search);
if(q.has('t')){ window.ready.then(()=>render(parseFloat(q.get('t')))); }
else if(!q.has('capture')){
  window.ready.then(()=>{
    const start=performance.now();
    (function loop(){ render(((performance.now()-start)/1000)%TOTAL); requestAnimationFrame(loop); })();
  });
}
</script>
