<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WebNotary</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <img src="../icons/icon32.png" alt="" width="26" height="26">
  <div>
    <h1>WebNotary</h1>
    <p>Evidence-grade web capture</p>
  </div>
</header>

<main>
  <section id="target" class="card target">
    <div class="target-title" id="tabTitle">…</div>
    <div class="target-host" id="tabHost"></div>
  </section>

  <section id="unsupported" class="card err hidden">
    This page can’t be captured. Open a regular web page (http, https or file) and try again.
  </section>

  <section id="form">
    <label>Matter / case reference
      <input id="matter" placeholder="e.g. 2026-CV-0412 (optional)" autocomplete="off">
    </label>
    <label>Notes for this capture
      <textarea id="notes" rows="2" placeholder="optional"></textarea>
    </label>
    <button id="captureBtn" class="primary">Capture evidence</button>
    <p class="operator-line" id="operatorLine"></p>
  </section>

  <section id="progress" class="card hidden">
    <ul id="stepList"></ul>
  </section>

  <section id="result" class="card ok hidden">
    <h2>Evidence bundle saved</h2>
    <div class="result-line" id="resultFile"></div>
    <div class="result-line" id="resultTs"></div>
    <div class="hash-row">
      <code id="resultHash"></code>
      <button id="copyHash" title="Copy the timestamped SHA-256 digest">Copy</button>
    </div>
    <div id="resultWarn" class="warn-line hidden"></div>
  </section>

  <section id="error" class="card err hidden">
    <h2>Capture failed</h2>
    <p id="errorMsg"></p>
  </section>

  <section id="recent">
    <h2>Recent captures</h2>
    <ul id="recentList"></ul>
    <p class="empty hidden" id="recentEmpty">None yet — your capture history appears here.</p>
  </section>
</main>

<footer>
  <a href="#" id="openVerify">Verify a bundle</a>
  <span>·</span>
  <a href="#" id="openOptions">Settings</a>
</footer>

<script type="module" src="popup.js"></script>
</body>
</html>
