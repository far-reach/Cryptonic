<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>WebNotary — Verify a bundle</title>
<link rel="stylesheet" href="verify.css">
</head>
<body>
<header>
  <img src="../icons/icon48.png" alt="" width="30" height="30">
  <div>
    <h1>Verify an evidence bundle</h1>
    <p>Re-checks every SHA-256 digest and RFC 3161 token — entirely in your browser, nothing is uploaded.</p>
  </div>
</header>

<main>
  <div id="drop" class="dropzone" tabindex="0">
    <strong>Drop a WebNotary bundle (.zip) here</strong>
    <span>or its extracted files — or</span>
    <label class="filebtn">browse…
      <input id="file" type="file" multiple>
    </label>
  </div>

  <section id="verdict" class="verdict hidden"></section>

  <section id="details" class="hidden">
    <h2>Capture</h2>
    <dl id="captureInfo" class="kv"></dl>

    <h2>Artifact digests (SHA-256)</h2>
    <table id="hashTable">
      <thead><tr><th></th><th>Artifact</th><th>Digest</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="kv-row manifest-row" id="manifestRow"></div>

    <h2>Trusted timestamps (RFC 3161)</h2>
    <div id="tokens"></div>

    <div id="warnings" class="warnings"></div>
  </section>
</main>

<script type="module" src="verify.js"></script>
</body>
</html>
