# polybot configuration — tuned for a $100 bankroll.
# Secrets NEVER go here; they are read from the environment (see .env.example).

risk:
  bankroll_usdc: 100.0        # total budget the bot is allowed to touch
  max_trade_usdc: 10.0        # cap per opportunity (10% of bankroll)
  max_market_usdc: 15.0       # cap per market across strategies
  max_deployed_frac: 0.80     # always keep >=20% cash
  kelly_fraction: 0.25        # quarter-Kelly for probabilistic bets
  max_value_positions: 8      # diversification for the value strategy
  halt_drawdown_frac: 0.25    # stop everything below $75 equity
  daily_loss_stop_usdc: 10.0  # stop for the day after -$10 realized

strategies:
  # Risk-free: buy YES+NO in one market for < $1
  complement_enabled: true
  complement_min_edge: 0.005          # require >=0.5% after fees

  # Risk-free: buy full YES or NO baskets in multi-outcome events
  negrisk_enabled: true
  negrisk_min_edge: 0.008             # more legs -> demand more edge
  negrisk_max_legs: 12

  # Probabilistic: near-resolution favorites (favorite-longshot bias)
  value_enabled: true
  value_min_price: 0.90
  value_max_price: 0.985
  value_max_days_to_end: 14
  value_min_annualized_return: 0.35   # after fees
  value_min_volume_24h: 5000
  value_min_liquidity: 2000
  value_stop_loss: 0.15               # exit if bid falls this far below cost

  # Passive market making: rest paired YES/NO bids summing < $1.
  # Makers pay ZERO fees and earn daily rebates funded by taker fees —
  # the most dependable earner for a small account.
  maker_enabled: true
  maker_min_spread: 0.03        # only quote markets whose spread pays
  maker_min_capture: 0.02       # required locked profit per matched pair
  maker_max_markets: 3          # concurrent markets quoted
  maker_quote_usdc: 8.0         # notional per quote pair
  maker_min_volume_24h: 10000   # busy markets fill both sides faster
  maker_mid_low: 0.15           # never quote the tails
  maker_mid_high: 0.85
  maker_min_days_to_end: 2      # never quote into a resolution
  maker_requote_ticks: 2        # cancel/replace when mid drifts 2 ticks
  maker_max_inventory_usdc: 12  # unpaired inventory cap per market
  maker_inventory_stop: 0.08    # dump inventory if it runs 8c against us

scanner:
  market_pages: 4             # 4 x 100 most-active markets per cycle
  min_volume_24h: 500
  poll_seconds: 30
  fast_poll_seconds: 6        # tighter loop right after activity/near-misses
  book_top_n: 120
  request_timeout: 15
  max_retries: 3
  settle_every_cycles: 10     # resolution check cadence for held positions

# Taker-fee base rates by category (fee = shares * rate * p * (1-p)).
# Defaults follow the March 2026 schedule; override here if Polymarket
# changes rates. Unknown categories use 0.05.
fee_overrides: {}
#  crypto: 0.07
#  politics: 0.04

state_file: state/portfolio.json
